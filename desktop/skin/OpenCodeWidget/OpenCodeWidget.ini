[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=1

[MeasureCollector]
Measure=Plugin
Plugin=RunCommand
Parameter=python3 "C:\Users\bened\Downloads\token-widget\collector\collect_opencode.py"
State=Hide
Timeout=300000
UpdateDivider=-1
FinishAction=[!Refresh]
DynamicVariables=1

[StyleLabel]
FontFace=Consolas
FontSize=8
FontColor=146,131,116
AntiAlias=1

[StyleValue]
FontFace=Segoe UI
FontSize=14
FontWeight=700
FontColor=235,219,178
AntiAlias=1

[StyleUnit]
FontFace=Consolas
FontSize=8
AntiAlias=1

[StyleTitle]
FontFace=Segoe UI
FontSize=11
FontWeight=600
FontColor=235,219,178
AntiAlias=1

[StyleSub]
FontFace=Consolas
FontSize=9
AntiAlias=1

